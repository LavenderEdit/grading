spring.application.name=grading
server.port=8080

# Habilitamos Flyway y dejamos que valide el esquema (no crear)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Ubicaci\u00f3n por defecto de Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# DataSource con placeholders y valores por defecto
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Security
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}
app.security.jwt.issuer=grading-api


# Actuator m\u00ednimo
management.endpoints.web.exposure.include=health,info
